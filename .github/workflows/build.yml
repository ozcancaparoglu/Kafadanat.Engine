name: Build image

# Builds and pushes the image; deploying stays manual with the deploy-<service> job in Jenkins.
# Tags match what that job lists: master-<Istanbul date>-<time>, plus latest.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-image

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=master-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Web.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/ozcancaparoglu/kafadanat-engine:${{ env.IMAGE_TAG }}
            ghcr.io/ozcancaparoglu/kafadanat-engine:latest
          build-args: |
            GITHUB_USER=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.PACKAGES_TOKEN }}
